name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # matches NODE_VERSION on Cloudflare Pages (docs/DEPLOY-CHECKLIST.md)
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check:seo
